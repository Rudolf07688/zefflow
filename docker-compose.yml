name: local-n8n-stack

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev
    ports:
      - "5432:5432"

  # ── Ollama ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: ollama
    restart: unless-stopped
    # Bind only to internal network; don't expose port to host in production
    # ports:
    #   - "127.0.0.1:11434:11434"   # uncomment only for local dev testing
    volumes:
      - ollama_data:/root/.ollama
    env_file:
      - .env
    environment:
      # Override: bind to all interfaces inside container (overrides .env default)
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s    # allow time for initial model downloads
    networks:
      - dev

  # ── Ollama Model Init (one-shot) ─────────────────────────────────────────
  # Pulls default models on first run; exits immediately after.
  # Remove or comment out after first successful start for faster restarts.
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: ollama-pull
    restart: "no"           # run once and exit
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        ollama pull ${DEFAULT_CHAT_MODEL:-llama3.2} &&
        ollama pull ${DEFAULT_EMBED_MODEL:-nomic-embed-text} &&
        echo 'Models ready'
      "
    env_file:
      - .env
    environment:
      # Override: point client at the ollama service rather than localhost
      - OLLAMA_HOST=ollama:11434
    networks:
      - dev

  # ── n8n ───────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    # Pin in production: n8nio/n8n:1.88.0
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    user: "1000:1000"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared:/data/shared          # shared filesystem for Read/Write File nodes
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dev

volumes:
  postgres_data:
  ollama_data:
  n8n_data:

networks:
  dev:
    driver: bridge
