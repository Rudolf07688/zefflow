[project]
name = "agent-workflows"
version = "0.1.0"
description = "Object-oriented agent workflows powered by Agno + Gemini/Vertex AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.1.0",
    "google-genai>=0.3.0",
    "google-cloud-aiplatform>=1.70.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.36",
    "rich>=13.9.0",
    "typer>=0.13.0",
]

[project.scripts]
run-workflow = "scripts.run_workflow:app"
seed-db = "scripts.seed_db:app"
agent-refresh = "scripts.agent_refresh:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workflows", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
